name: ChaosPanel
version: 1.0.2
main: com.chaossmp.chaospanel.ChaosPanel
api-version: '1.21'
author: W1nUser
description: ChaosSMP administration and monitoring panel

commands:
  ownerpanel:
    description: Главная команда ChaosPanel
    usage: /ownerpanel [help|status]
    permission: chaospanel.use

permissions:
  chaospanel.use:
    description: Доступ к панели ChaosPanel
    default: false
  chaospanel.admin:
    description: Полный доступ к функциям ChaosPanel
    default: false
    children:
      chaospanel.use: true
